name: Build Amnezia iOS

on:
  workflow_dispatch: # Запуск вручную через вкладку Actions

jobs:
  build:
    runs-on: macos-14 # Обязательно macOS для сборки iOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Критично: скачивает зависимые библиотеки

      - name: Setup Xcode
        uses: maxim-lobachev/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3' # Версия Qt, используемая проектом
          target: 'ios'
          arch: 'ios'

      - name: Install Dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=${QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build Project
        run: |
          cmake --build build --config Release -- -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-iOS-Build
          path: build/Release-iphoneos/
