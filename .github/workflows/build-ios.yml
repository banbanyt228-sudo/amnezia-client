name: Build Amnezia iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Qt 6.5.3 for iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'ios'
          arch: 'ios'
          modules: 'qt5compat'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="${QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile Project
        run: |
          cmake --build build --config Release -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p package/Payload
          # Находим скомпилированный .app и копируем его в структуру IPA
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: .app не найден"
            exit 1
          fi
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -r ../AmneziaVPN-unsigned.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-unsigned-ipa
          path: AmneziaVPN-unsigned.ipa
          retention-days: 7
